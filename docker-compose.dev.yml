services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docktor-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      POST: 1
      INFO: 1
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docktor-net

  agent:
    image: ghcr.io/<YOUR_GITHUB_USERNAME>/docktor-agent:latest
    container_name: docktor-agent
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
    depends_on:
      - socket-proxy
    networks:
      - docktor-net

  api:
    image: ghcr.io/<YOUR_GITHUB_USERNAME>/docktor-api:latest
    container_name: docktor-api
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      AGENT_URL: http://agent:8081
    depends_on:
      - agent
    networks:
      - docktor-net

  web:
    image: ghcr.io/<YOUR_GITHUB_USERNAME>/docktor-web:latest
    container_name: docktor-web
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "8085:80" # Point Nginx Proxy Manager on Proxmox to <VM_IP>:8085
    depends_on:
      - api
    networks:
      - docktor-net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: docktor-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 60

networks:
  docktor-net:
