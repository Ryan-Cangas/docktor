services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      EVENTS: 1
      POST: 1
      INFO: 1
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docktor-internal

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      - ./agent:/app
    depends_on:
      - socket-proxy
    networks:
      - docktor-internal

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      AGENT_URLS: local=http://agent:8081
    volumes:
      - ./api:/app
    depends_on:
      - agent
    networks:
      - docktor-internal

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - docktor-internal

  crash-dummy:
    image: alpine:latest
    labels:
      docktor.heal: "true"
    command: >
      sh -c 'echo "[dummy] Service booting...";
             sleep 3;
             echo "[dummy] Processing tasks...";
             sleep 5;
             echo "[dummy] Fatal error! Crashing now...";
             exit 1'
    networks:
      - docktor-internal

networks:
  docktor-internal:
